[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tyler-covariance-estimation"
version = "0.1.0"
description = "Robust covariance estimation using Tyler's M-estimator for portfolio optimization"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "scipy>=1.7",
    "yfinance>=0.2.0"
]
